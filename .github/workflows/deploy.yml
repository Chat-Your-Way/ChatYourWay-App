name: Build CI

on:
  push:
    branches: 
      - v3
  pull_request:
    branches:
      - v3

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'adopt'
        architecture: x64
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean install

    - name: Finalize Build
      run: echo "Build completed successfully!"
